# Quantum Hall on Cloudflare: the gallery as static files, at hall.steady-watch.com.
# Deploy from this folder with `npx wrangler deploy` (after committing). .assetsignore keeps the
# motion lab, git history and repo files out of the upload.
name = "quantum-hall"
compatibility_date = "2026-10-01"
routes = [{ pattern = "hall.steady-watch.com", custom_domain = true }]

[assets]
directory = "."
