<style>
/* Layout: full-bleed WebGL hall; HUD pinned to edges; project "inside the painting" opens as a full overlay */
:root {
  --night: #080a12;      /* cleanroom dark / page ground */
  --stone: #141826;      /* panel surface */
  --gilt: #d9a441;       /* frame gold, the one accent */
  --gilt-dim: #8a6a2e;
  --parchment: #f1e6cf;  /* text on dark */
  --muted: #a3adc2;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--parchment); font-family: var(--body); overflow: hidden; touch-action: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

.hud { position: fixed; pointer-events: none; z-index: 2; }
.hud > * { pointer-events: auto; }
#top {
  top: 0; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  padding-top: calc(28px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 36px;
  pointer-events: none;
  background: radial-gradient(620px 240px at 0 0, var(--night) 0%, color-mix(in srgb, var(--night) 90%, transparent) 55%, transparent 100%);
  text-shadow: 0 1px 2px var(--night);
}
#top > * { pointer-events: none; }
#title { min-width: 0; max-width: 100%; }
#title h1 {
  font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.1;
  padding-block: 4px; margin: 0; letter-spacing: -0.01em; overflow-wrap: anywhere;
  color: var(--parchment); text-shadow: 0 2px 0 #000a;
  font-feature-settings: "kern", "liga"; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
}
/* parchment flowing into the hall's teal, with a slow shimmer */
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  #title h1 {
    background: linear-gradient(100deg, var(--parchment) 0%, #c8fbff 30%, #3fe0e0 55%, #1aa6b8 75%, #c8fbff 90%, var(--parchment) 100%);
    background-size: 220% 100%; background-position: 0% 50%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent; text-shadow: none;
    filter: drop-shadow(0 0 14px rgba(63, 224, 224, .28)) drop-shadow(0 2px 0 rgba(0, 0, 0, .55));
    animation: titleShimmer 9s ease-in-out infinite alternate;
  }
}
@keyframes titleShimmer { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
@media (prefers-reduced-motion: reduce) { #title h1 { animation: none; } }
/* the caret sits raised and lighter, like a superscript mark */
#title h1 .caret { display: inline-block; font-size: .62em; transform: translateY(-.42em); margin-left: .04em; }
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  #title h1 .caret {   /* a raised inline-block is painted on its own, so it carries its own fill */
    background: linear-gradient(180deg, #c8fbff, #3fe0e0);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  }
}
#title a.listlink { color: var(--gilt); pointer-events: auto; text-underline-offset: 3px; }
#title p { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted); max-width: 46ch; }
#controls {
  min-width: 0; max-width: 100%; text-align: left;
  font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.7; letter-spacing: .04em;
}
@media (max-width: 560px) { .dir-btn { font-size: 11px; padding: 8px 9px; letter-spacing: .03em; } }
#controls kbd { font-family: var(--mono); border: 1px solid var(--gilt-dim); border-radius: 3px; padding: 0 4px; color: var(--parchment); }
@media (max-width: 640px), (pointer: coarse) { #controls .desk { display: none; } }
@media (min-width: 641px) and (pointer: fine) { #controls .touch { display: none; } }

#directory {
  bottom: 0; left: 0; right: 0; padding-top: 32px;
  background: linear-gradient(to top, color-mix(in srgb, var(--night) 85%, transparent), transparent);
  display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dir-btn {
  flex: 0 1 auto; min-width: 0; white-space: nowrap;
  font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  background: color-mix(in srgb, var(--night) 75%, transparent); color: var(--parchment);
  border: 1px solid var(--gilt-dim); border-radius: 2px; padding: 8px 12px; cursor: pointer;
}
.dir-btn:hover, .dir-btn:focus-visible { border-color: var(--gilt); color: var(--gilt); outline: none; }

#prompt {
  left: 0; right: 0; margin-inline: auto; width: fit-content;
  max-width: min(520px, calc(100vw - 2 * max(16px, env(safe-area-inset-left, 0px))));
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 4px; justify-items: center; text-align: center;
  font-family: var(--display); font-size: 18px; line-height: 1.25; color: var(--parchment);
  background: color-mix(in srgb, var(--night) 82%, transparent); border: 1px solid var(--gilt);
  padding: 10px 18px; border-radius: 2px; cursor: pointer;
  text-wrap: balance; overflow-wrap: anywhere;
}
#prompt span { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gilt); }

#stick { position: fixed; z-index: 3; width: 110px; height: 110px; border-radius: 50%; border: 1px solid var(--gilt-dim); background: color-mix(in srgb, var(--night) 40%, transparent); pointer-events: none; transform: translate(-50%, -50%); }
#stick i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; border-radius: 50%; background: var(--gilt); opacity: .7; }

#flash { position: fixed; inset: 0; z-index: 4; background: var(--parchment); opacity: 0; pointer-events: none; transition: opacity .35s; }

#room {
  position: fixed; inset: 0; z-index: 5; overflow-y: auto;
  background: var(--room-bg, var(--stone)); color: var(--room-fg, var(--parchment));
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: roomIn .5s ease-out;
}
@keyframes roomIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
.room-inner { max-width: 760px; margin: 0 auto; display: grid; gap: 24px; }
.room-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.room-eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--room-accent, var(--gilt)); }
#exit { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; background: transparent; color: inherit; border: 1px solid currentColor; padding: 8px 12px; border-radius: 2px; cursor: pointer; }
#exit:focus-visible { outline: 2px solid var(--room-accent, var(--gilt)); outline-offset: 2px; }
#room canvas.art { width: 100%; max-width: var(--art-max, 100%); justify-self: center; height: auto; box-shadow: 0 20px 40px #0008; }
#room h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 48px); margin: 0; line-height: 1.05; text-wrap: balance; overflow-wrap: anywhere; }
.tagline { font-size: 18px; margin: 6px 0 0; color: var(--room-accent, var(--gilt)); }
.desc { font-size: 16px; line-height: 1.6; max-width: 65ch; margin: 0; }
.modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
.modules li { border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent); padding-top: 10px; min-width: 0; }
.modules b { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--room-accent, var(--gilt)); margin-bottom: 4px; }
.modules span { font-size: 14px; line-height: 1.5; }
.stack { font-family: var(--mono); font-size: 12px; opacity: .8; line-height: 1.8; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.links a { font-family: var(--mono); font-size: 13px; color: inherit; text-decoration: none; border: 1px solid var(--room-accent, var(--gilt)); padding: 10px 14px; border-radius: 2px; }
.links a:hover, .links a:focus-visible { background: var(--room-accent, var(--gilt)); color: var(--room-bg, var(--stone)); outline: none; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; font-family: var(--display); color: var(--gilt); font-size: 20px; background: var(--night); }
</style>

</head>

<canvas id="scene" tabindex="0" aria-label="3D gallery. Use the project buttons at the bottom to visit each painting."></canvas>

<header class="hud" id="top">
<div id="title">

  <p>Walk up to a painting and step inside to see the project. <a class="listlink" href="https://github.com/Infin-8/Projects#apps">Prefer a list?</a></p>
</div>

  <div class="desk"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · drag to look</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Projects (from github.com/Infin-8/Projects) ---------- */
const PROJECTS = [
  {
    id: 'kaizendoku', name: 'KaizenDoku', tagline: 'Sudoku. With Friends.', wing: 'Apps',
    desc: 'Sudoku for solo play or head-to-head with a friend. Co-op matches run inside iMessage, and time-attack mode tracks your solo best times. Results post to Game Center leaderboards and achievements, and mindful minutes log to Apple Health. Every board is generated from IBM Quantum hardware entropy through the STEADYWATCH™ Platform (QES-256).',
    modules: [['CO-OP','Matches played inside iMessage'],['TIME ATTACK','Solo best times'],['GAME CENTER','Leaderboards and achievements'],['HEALTH','Mindful minutes logged']],
    stack: 'iMessage · Game Center · Apple Health · QES-256 boards',
    links: [['App Store','https://apps.apple.com/us/app/kaizendoku/id6748037311'],['kaizendoku.com','https://kaizendoku.com']],
    theme: { bg: '#1b1b1b', fg: '#e8ffe8', accent: '#00ff66' }, logo: 'assets/kaizendoku-icon.png',
    pos: [-7.92, 3.2, -3.5], rotY: Math.PI / 2, size: [3.7, 3.7]
  },
  {
    id: 'handheld', name: 'STEADYWATCH™ HANDHELD', tagline: 'Atomic Clock Multi-Tool', wing: 'Apps',
    desc: 'Five instruments in one app, from an NTP-synced atomic clock to Face ID-approved sign-ins.',
    modules: [['ATOMIC','Clock synced to atomic time standards via NTP'],['HARMONIC','Real-time frequency spectrum and tuner'],['QUANTUM','Face ID-gated key generator bound to the Secure Enclave, seeded from platform quantum entropy'],['VAULT','Quantum-seeded credential storage'],['APPROVE','Biometric OIDC authorization']],
    stack: 'NTP · Face ID · Secure Enclave · OIDC',
    links: [['App Store','https://apps.apple.com/us/app/steadywatch-handheld/id6755752518'],['steady-watch.com','https://steady-watch.com']],
    theme: { bg: '#00304d', fg: '#d9f2ee', accent: '#3fe0e0' }, logo: 'assets/steadywatch-icon.png',
    pos: [7.92, 3.2, -3.5], rotY: -Math.PI / 2, size: [3.7, 3.7]
  },
  {
    id: 'platform', name: 'STEADYWATCH™ PLATFORM', tagline: 'Entropy as a Service', wing: 'Platform',
    desc: 'Quantum-derived randomness and security as a service. Every product produces 32-byte QES-256 keys, each tied to a verifiable IBM Quantum job ID.',
    modules: [['Q-RNG','Quantum random number API on IBM Quantum hardware'],['OIDC','Biometric identity provider (RFC 8628 device flow), approved with Face ID in Handheld'],['SHQKD','Hybrid X25519 + ML-KEM-768 (FIPS 203) key exchange via HKDF; the relay never sees the derived key'],['QCAP STACK','IBM Quantum · Cloudflare · Secure Enclave · Raspberry Pi']],
    stack: 'IBM Quantum · X25519 · ML-KEM-768 · HKDF · RFC 8628 · Cloudflare · Raspberry Pi',
    links: [['steady-watch.com','https://steady-watch.com'],['Q-RNG demo','https://steady-watch.com/qrng.html'],['OIDC demo','https://steady-watch.com/oidc.html'],['Live status','https://steady-watch.com/status.html']],
    theme: { bg: '#0a0a1f', fg: '#e6e6ff', accent: '#8ea2ff' }, logo: 'assets/steadywatch-icon.png',
    pos: [0, 3.4, -14.92], rotY: 0, size: [6.4, 4.4]
  }
];

/* ---------- Painting art (canvas) ---------- */
const W = 1024, H = 768;
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Square portrait: the app icon, full bleed, with a thin inner mat line
function drawLogo(c, img) {
  const g = c.getContext('2d');
  if (img) g.drawImage(img, 0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 10; g.strokeRect(5, 5, c.width - 10, c.height - 10);
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

const keyHex = (() => { const b = new Uint8Array(32); crypto.getRandomValues(b); return [...b].map(x => x.toString(16).padStart(2, '0')).join(''); })();
function drawPlatform(c, img) {
  const g = c.getContext('2d');
  const bg = g.createRadialGradient(W * .3, H * .45, 40, W * .3, H * .45, 600);
  bg.addColorStop(0, '#1c1f5a'); bg.addColorStop(1, '#07071a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // stars
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(230,230,255,${(i * 37 % 100) / 140})`; g.fillRect((i * 263) % W, (i * 151) % H, 2, 2); }
  // the STEADYWATCH icon, hung inside the painting
  if (img) {
    g.save(); rr(g, 50, 144, 470, 470, 40); g.shadowColor = '#000'; g.shadowBlur = 40; g.fillStyle = '#000'; g.fill(); g.restore();
    g.save(); rr(g, 50, 144, 470, 470, 40); g.clip(); g.drawImage(img, 50, 144, 470, 470); g.restore();
    g.strokeStyle = '#8ea2ff'; g.lineWidth = 2; rr(g, 50, 144, 470, 470, 40); g.stroke();
  }
  // text block
  g.textAlign = 'left'; g.fillStyle = '#e6e6ff';
  // shrink the title until it fits the right column (560 → 984, inside the frame)
  let ts = 50; do { g.font = `${ts}px "Young Serif", Georgia, serif`; } while (g.measureText('STEADYWATCH™').width > 424 && --ts > 20);
  g.fillText('STEADYWATCH™', 560, 150);
  g.font = '28px "IBM Plex Mono", monospace'; g.fillStyle = '#8ea2ff'; g.fillText('PLATFORM · EaaS', 562, 194);
  g.font = '600 20px "IBM Plex Mono", monospace'; g.fillStyle = '#e6e6ff';
  ['Q-RNG', 'OIDC', 'SHQKD', 'QCAP STACK'].forEach((t, i) => { g.fillStyle = '#ffd36b'; g.fillText('▸', 562, 270 + i * 40); g.fillStyle = '#e6e6ff'; g.fillText(t, 590, 270 + i * 40); });
  g.fillStyle = '#8ea2ff'; g.font = '16px "IBM Plex Mono", monospace'; g.fillText('32-byte key (illustration)', 562, 470);
  g.fillStyle = '#e6e6ff'; g.font = '20px "IBM Plex Mono", monospace';
  for (let i = 0; i < 4; i++) g.fillText(keyHex.slice(i * 16, i * 16 + 16).replace(/(..)/g, '$1 ').trim(), 562, 505 + i * 30);
  g.fillStyle = '#5b6bc9'; g.font = '16px "IBM Plex Mono", monospace'; g.fillText('X25519 + ML-KEM-768 → HKDF', 562, 660);
}
const DRAW = { kaizendoku: drawLogo, handheld: drawLogo, platform: drawPlatform };

/* ---------- Environment textures ---------- */
function floorTex() {
  // polished dark stone, still checkered so it reads as the castle floor
  const c = mk(512, 512), g = c.getContext('2d');
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    g.fillStyle = (x + y) % 2 ? '#20242f' : '#11141c'; g.fillRect(x * 128, y * 128, 128, 128);
    g.strokeStyle = '#3a4357'; g.lineWidth = 1.5; g.strokeRect(x * 128 + 0.75, y * 128 + 0.75, 126.5, 126.5);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 7); t.anisotropy = 8; return t;
}
function wallTex(glow) {
  // dark slate panels; the glow version is black except for a few lit seams (used as emissive map)
  const c = mk(512, 512), g = c.getContext('2d');
  g.fillStyle = glow ? '#000' : '#181c27'; g.fillRect(0, 0, 512, 512);
  for (let row = 0; row < 4; row++) for (let col = 0; col < 2; col++) {
    const x = col * 256, y = row * 128;
    if (!glow) {
      const gr = g.createLinearGradient(x, y, x, y + 128); gr.addColorStop(0, '#1e2330'); gr.addColorStop(1, '#151923');
      g.fillStyle = gr; g.fillRect(x + 3, y + 3, 250, 122);
      g.strokeStyle = '#0b0d13'; g.lineWidth = 3; g.strokeRect(x + 1.5, y + 1.5, 253, 125);
    } else if (row === 1) {
      g.fillStyle = '#3fe0e0'; g.fillRect(x, y + 126, 256, 2);
    }
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function carpetTex() {
  // the photon path: dark runner with teal edge lines and a soft cyan beam down the middle
  const c = mk(128, 512), g = c.getContext('2d');
  g.fillStyle = '#0b0e16'; g.fillRect(0, 0, 128, 512);
  const beam = g.createLinearGradient(0, 0, 128, 0);
  beam.addColorStop(0.30, 'rgba(63,224,224,0)'); beam.addColorStop(0.5, 'rgba(120,240,240,0.85)'); beam.addColorStop(0.70, 'rgba(63,224,224,0)');
  g.fillStyle = beam; g.fillRect(0, 0, 128, 512);
  g.fillStyle = '#3fe0e0'; g.fillRect(2, 0, 3, 512); g.fillRect(123, 0, 3, 512);
  const t = new THREE.CanvasTexture(c); t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 6); return t;
}
function dotTex() {
  const c = mk(64, 64), g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
function labelTex(text) {
  const c = mk(640, 64), g = c.getContext('2d');
  g.fillStyle = '#a3adc2'; g.font = '600 30px "IBM Plex Mono", monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(text, 8, 34); return new THREE.CanvasTexture(c);
}
function plaqueTex(p) {
  const c = mk(512, 128), g = c.getContext('2d');
  g.fillStyle = '#c8933a'; g.fillRect(0, 0, 512, 128);
  g.strokeStyle = '#7a5520'; g.lineWidth = 6; g.strokeRect(6, 6, 500, 116);
  g.fillStyle = '#2a1b08'; g.textAlign = 'center';
  g.font = '34px "Young Serif", Georgia, serif'; g.fillText(p.name.replace('STEADYWATCH™ ', 'SW™ '), 256, 58);
  g.font = '20px "IBM Plex Mono", monospace'; g.fillText(p.tagline, 256, 96);
  return new THREE.CanvasTexture(c);
}

/* ---------- Ripple shader (the SM64 bit) ---------- */
const vert = `
uniform float uTime; uniform float uAmp; uniform vec2 uHit; uniform float uAspect;
varying vec2 vUv; varying float vWave;
void main(){
  vUv = uv; vec3 p = position;
  float d = distance(uv * vec2(uAspect,1.0), uHit * vec2(uAspect,1.0));
  float w = sin(d*38.0 - uTime*7.0) * exp(-d*2.2) * uAmp;
  p.z += w; vWave = w;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
}`;
const frag = `
uniform sampler2D map; uniform float uGlow;
varying vec2 vUv; varying float vWave;
void main(){
  vec2 uv = vUv + vec2(vWave*0.35, vWave*0.25);

function wrapText(g, text, x, y, maxW, lh) {
  let line = '';
  for (const word of text.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); line = word; y += lh; } else line = test;
  }
  g.fillText(line, x, y); return y + lh;
}

// detector: single hits sampled from the two-slit intensity, accumulating
const det = mk(768, 576), dg = det.getContext('2d');
const detTex = new THREE.CanvasTexture(det);
let hits = 0;
function detReset() {
  dg.fillStyle = '#05070b'; dg.fillRect(0, 0, 768, 576); hits = 0;
}
function detIntensity(u) {           // u in [-1, 1] across the screen
  const beta = 5.2 * u, alpha = 1.25 * u;   // fringe term and single-slit envelope
  const env = alpha === 0 ? 1 : Math.sin(alpha) / alpha;
  return Math.cos(beta) ** 2 * env * env;
}
function detHit() {
  let u; do { u = Math.random() * 2 - 1; } while (Math.random() > detIntensity(u));
  const x = 384 + u * 360, y = 24 + Math.random() * 456;
  dg.fillStyle = 'rgba(127,240,240,0.85)'; dg.fillRect(x - 1.5, y - 1.5, 3, 3); hits++;
}
function detLabel() {
  dg.fillStyle = '#05070b'; dg.fillRect(0, 496, 768, 80);
  dg.fillStyle = '#3fe0e0'; dg.font = '600 22px "IBM Plex Mono", monospace'; dg.textAlign = 'left'; dg.fillText('DETECTOR · SINGLE PHOTONS', 36, 546);
  dg.textAlign = 'right'; dg.fillStyle = '#c9d2e3'; dg.fillText('n = ' + hits.toLocaleString('en-US'), 732, 546); dg.textAlign = 'left';
}
detReset(); detLabel();
framedPanel(2.9, 2.175, 4.8, detTex);
let detAcc = 0;
function updateSlits(dt, t) {
  fringeU.uTime.value = reduceMotion ? 0 : t;
  detAcc += dt * (reduceMotion ? 40 : 90);
  while (detAcc >= 1) { detAcc -= 1; detHit(); }
  if (hits > 14000) detReset();
  detLabel(); detTex.needsUpdate = true;
}

function updateQuantum(dt, t) {
  updateSlits(dt, t);
  const m = reduceMotion ? 0.15 : 1;
  // a pulse of cold travels down the stages, top to bottom
  pulses.forEach((pm, i) => { const ph = (t * 0.7 - i * 0.22) % 1.6; pm.opacity = 0.12 + 0.75 * Math.max(0, 1 - Math.abs(ph - 0.3) * 4); });
  for (let i = 0; i < PHOTONS; i++) {
    let z = pPos[i * 3 + 2] - pSpd[i] * dt * m;
    if (z < ROOM.zMin + 1) z = ROOM.zMax - 1;
    pPos[i * 3 + 2] = z;

}

  canvas.setPointerCapture(e.pointerId);
  if (e.pointerType === 'touch' && e.clientX < innerWidth * 0.45 && e.clientY > innerHeight * 0.45 && joy.id === null) {
    joy = { x: 0, y: 0, id: e.pointerId, ox: e.clientX, oy: e.clientY };
    stick.hidden = false; stick.style.left = e.clientX + 'px'; stick.style.top = e.clientY + 'px';

    let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const m = Math.hypot(dx, dy), max = 45;
    if (m > max) { dx *= max / m; dy *= max / m; }
    joy.x = dx / max; joy.y = dy / max;

    look.moved += Math.abs(dx) + Math.abs(dy); look.x = e.clientX; look.y = e.clientY;

      <canvas class="art" width="${pt.art.width}" height="${pt.art.height}"></canvas>
      <p class="desc">${esc(p.desc)}</p>
      <ul class="modules">${p.modules.map(([k, v]) => `<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join('')}</ul>
      <div class="stack">${esc(p.stack)}</div>
      <div class="links">${p.links.map(([l, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join('')}</div>
    </div>`;
  // app icons show as-is here, without the dark edge line drawn for the wall paintings
  const logo = p.id !== 'platform' && LOGOS[p.logo];
  room.querySelector('canvas.art').getContext('2d').drawImage(logo || pt.art, 0, 0, pt.art.width, pt.art.height);
  room.hidden = false; room.scrollTop = 0;
  room.querySelector('#exit').addEventListener('click', exitRoom);
  room.querySelector('#exit').focus();
  try { history.replaceState(null, '', '#' + p.id); } catch (e) {}
}
function exitRoom() {
  if (!current) return;
  const pt = current; current = null;
  room.hidden = true; room.innerHTML = '';
  const pos = pt.center.clone().addScaledVector(pt.normal, 3.4); pos.y = 1.7;
  player.pos.copy(pos);
  const d = pt.center.clone().sub(pos); player.yaw = Math.atan2(-d.x, -d.z); player.pitch = 0.22;
  pt.amp = 0.22; mode = 'walk'; canvas.focus();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}

/* ---------- Directory ---------- */
const dir = document.getElementById('directory');
PROJECTS.forEach((p, i) => {
  const b = document.createElement('button'); b.className = 'dir-btn'; b.type = 'button'; b.id = 'go-' + p.id;
  b.textContent = p.name.replace('STEADYWATCH™ ', 'SW ');
  b.addEventListener('click', () => { if (paintings[i]) walkTo(paintings[i]); });
  dir.appendChild(b);
});
const slitStop = { exhibit: true, standOff: 7, pitch: -0.12, center: new THREE.Vector3(0, SLIT.y, SLIT.z), normal: new THREE.Vector3(0, 0, -1) };
{
  const b = document.createElement('button'); b.className = 'dir-btn'; b.type = 'button'; b.id = 'go-double-slit';
  b.textContent = 'Double slit'; b.addEventListener('click', () => walkTo(slitStop)); dir.appendChild(b);
}
const promptEl = document.getElementById('prompt');
promptEl.addEventListener('click', () => { if (near && mode === 'walk') enter(near); });

/* ---------- Loop ---------- */
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), mv = new THREE.Vector3();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  if (mode === 'walk' || mode === 'auto') {
    fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)); right.set(-fwd.z, 0, fwd.x);
    mv.set(0, 0, 0);
    const kx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    const kz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    mv.addScaledVector(fwd, kz - joy.y).addScaledVector(right, kx + joy.x);
    if (mv.lengthSq() > 0.01 && mode === 'auto') mode = 'walk';
    if (mode === 'auto' && auto) {
      const d = auto.target.clone().sub(player.pos); d.y = 0;
      const want = Math.atan2(-(auto.pt.center.x - player.pos.x), -(auto.pt.center.z - player.pos.z));
      let dy = want - player.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      player.yaw += dy * Math.min(1, dt * 5); player.pitch += ((auto.pt.pitch ?? 0.2) - player.pitch) * Math.min(1, dt * 4);
      if (d.length() < 0.15) { mode = 'walk'; const pt = auto.pt; auto = null; if (!pt.exhibit) enter(pt); }
      else mv.copy(d.normalize());
    }
    if (mv.lengthSq() > 1) mv.normalize();
    const speed = mode === 'auto' ? 6 : (keys.ShiftLeft ? 7 : 4.2);
    player.pos.addScaledVector(mv, speed * dt);
    player.pos.x = Math.max(-ROOM.x + 1, Math.min(ROOM.x - 1, player.pos.x));
    player.pos.z = Math.max(ROOM.zMin + 1, Math.min(ROOM.zMax - 0.8, player.pos.z));
    const bob = mv.lengthSq() > 0.01 && !reduceMotion ? Math.sin(t * 10) * 0.04 : 0;
    camera.position.set(player.pos.x, 1.7 + bob, player.pos.z);
    camera.rotation.set(0, 0, 0, 'YXZ'); camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw; camera.rotation.x = player.pitch;
    camera.fov += (65 - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();

    // proximity
    near = null; let best = 5.2;
    for (const pt of paintings) {
      const d = pt.center.clone().sub(camera.position); d.y = 0;
      const dist = d.length(), facing = -d.normalize().dot(pt.normal);
      if (dist < best && facing > 0.3) { best = dist; near = pt; }
    }
    if (near && mode === 'walk') {
      promptEl.innerHTML = `<span>Press E or tap to enter</span><b style="font-weight:400">${esc(near.p.name)}</b>`; promptEl.hidden = false;
    } else promptEl.hidden = true;
  }

  if (mode === 'entering' && anim) {
    anim.t += dt / anim.dur; const k = Math.min(1, anim.t), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(anim.from, anim.to, e);
    camera.quaternion.slerpQuaternions(anim.fromQ, anim.toQ, Math.min(1, e * 1.6));
    camera.fov = 65 + e * 25; camera.updateProjectionMatrix();
    anim.pt.amp = 0.06 + e * 0.3; anim.pt.uniforms.uGlow.value = e * 0.25;
    if (k > 0.72 && !anim.flashed) { anim.flashed = true; flash.style.opacity = 1; }
    if (k >= 1) {
      mode = 'inside'; const pt = anim.pt; anim = null;
      openRoom(pt); pt.uniforms.uGlow.value = 0;
      setTimeout(() => { flash.style.opacity = 0; }, 80);
    }
  }

  for (const pt of paintings) {
    const target = mode === 'entering' ? pt.amp : (near === pt ? 0.045 : 0);
    if (mode !== 'entering') pt.amp += (target - pt.amp) * Math.min(1, dt * 2.5);
    pt.uniforms.uAmp.value = reduceMotion ? Math.min(pt.amp, 0.02) : pt.amp;
    pt.uniforms.uTime.value = t;
    if (near !== pt && mode !== 'entering') pt.uniforms.uHit.value.lerp(new THREE.Vector2(.5, .5), dt);
  }

  if (mode !== 'inside') { updateQuantum(dt, t); renderer.render(scene, camera); }
  requestAnimationFrame(tick);
}

const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
const LOGOS = {};
const loadLogo = f => new Promise(res => { const i = new Image(); i.onload = () => { LOGOS[f] = i; res(); }; i.onerror = () => res(); i.src = f; });
Promise.all([
  fontsReady, loadLogo('assets/kaizendoku-icon.png'), loadLogo('assets/steadywatch-icon.png'),
  document.fonts ? Promise.all(['40px "Young Serif"', '20px "IBM Plex Mono"', '600 20px "IBM Plex Mono"', '20px "IBM Plex Sans"'].map(f => document.fonts.load(f).catch(() => {}))) : null
]).then(() => {
  buildPaintings(); buildSlitExhibit();
  document.getElementById('loading').remove();
  const hash = location.hash.slice(1); const deep = paintings.find(p => p.p.id === hash) || (hash === 'double-slit' ? slitStop : null);
  if (deep) { const pos = deep.center.clone().addScaledVector(deep.normal, deep.standOff || 3.4); player.pos.set(pos.x, 1.7, pos.z); const d = deep.center.clone().sub(pos); player.yaw = Math.atan2(-d.x, -d.z); if (deep.pitch !== undefined) player.pitch = deep.pitch; }
  tick();
});
})();
</script>
